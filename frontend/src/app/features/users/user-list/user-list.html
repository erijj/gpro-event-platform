<h2>Liste des utilisateurs</h2>

<p *ngIf="loading()">Chargement...</p>

<p *ngIf="errorMessage()" class="error">{{ errorMessage() }}</p>

<table *ngIf="!loading() && !errorMessage()">
  <thead>
    <tr>
      <th>Nom</th>
      <th>Prénom</th>
      <th>Email</th>
      <th>Rôle</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let user of users()">
      <td><a [routerLink]="['/users', user.id]">{{ user.nom }}</a></td>
      <td>{{ user.prenom }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.role }}</td>
    </tr>
  </tbody>
</table>
