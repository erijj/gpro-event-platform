@if (loading()) {
  <p>Chargement...</p>
} @else if (errorMessage()) {
  <p>{{ errorMessage() }}</p>
} @else if (user()) {
  <h2>{{ user()!.nom }} {{ user()!.prenom }}</h2>
  <p>Email : {{ user()!.email }}</p>
  <p>Rôle : {{ user()!.role }}</p>
  <p>Créé le : {{ user()!.createdAt }}</p>
  <a [routerLink]="['/users', user()!.id, 'edit']">Modifier</a>
  <button (click)="onDelete()">Supprimer</button>
}
