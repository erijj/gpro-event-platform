@if (loading()) {
  <p class="state-loading">Chargement...</p>
} @else {
  <div class="page">
    <h2 class="page-title">Modifier la catégorie</h2>

    <ui-card>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
        <div class="form-group">
          <label class="form-label">Libellé</label>
          <input type="text" formControlName="libelle" class="form-input">
        </div>

        <div class="form-actions">
          <ui-button type="submit" [disabled]="form.invalid">Enregistrer</ui-button>
        </div>
      </form>
    </ui-card>
  </div>
}

@if (errorMessage()) {
  <p class="state-error">{{ errorMessage() }}</p>
}
