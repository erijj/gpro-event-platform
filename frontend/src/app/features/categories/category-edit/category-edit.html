@if (loading()) {
  <p>Chargement...</p>
} @else {
  <h2>Modifier la catégorie</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label>
      Libellé :
      <input type="text" formControlName="libelle">
    </label>

    <button type="submit" [disabled]="form.invalid">Enregistrer</button>
  </form>
}

@if (errorMessage()) {
  <p class="error">{{ errorMessage() }}</p>
}
