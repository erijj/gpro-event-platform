<div class="page">
  <div class="page-header">
    <h2 class="page-title">Catégories</h2>
    @if (authService.isAdmin()) {
      <a routerLink="/categories/create">
        <ui-button variant="primary">+ Nouvelle catégorie</ui-button>
      </a>
    }
  </div>

  @if (loading()) {
    <p class="state-loading">Chargement...</p>
  }

  @if (errorMessage()) {
    <p class="state-error">{{ errorMessage() }}</p>
  }

  @if (!loading() && !errorMessage()) {
    <div class="chip-cloud">
      @for (category of categories(); track category.id) {
        <a [routerLink]="['/categories', category.id]" class="category-chip">
          {{ category.libelle }}
        </a>
      }
    </div>
  }
</div>
