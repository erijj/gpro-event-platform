<div class="page">
  <div class="page-header">
    <h2 class="page-title">Liste des catégories</h2>
    @if (authService.isAdmin()) {
      <a routerLink="/categories/create">
        <ui-button variant="primary">+ Nouvelle catégorie</ui-button>
      </a>
    }
  </div>

  @if (loading()) {
    <p class="state-loading">Chargement...</p>
  }

  @if (errorMessage()) {
    <p class="state-error">{{ errorMessage() }}</p>
  }

  @if (!loading() && !errorMessage()) {
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Libellé</th>
          </tr>
        </thead>
        <tbody>
          @for (category of categories(); track category.id) {
            <tr>
              <td><a [routerLink]="['/categories', category.id]" class="table-link">{{ category.libelle }}</a></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
