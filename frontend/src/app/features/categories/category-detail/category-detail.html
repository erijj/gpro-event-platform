@if (loading()) {
  <p class="state-loading">Chargement...</p>
} @else if (errorMessage()) {
  <p class="state-error">{{ errorMessage() }}</p>
} @else if (category()) {
  <div class="page">
    <div class="page-header">
      <h2 class="page-title">{{ category()!.libelle }}</h2>
      @if (authService.isAdmin()) {
        <div class="page-actions">
          <a [routerLink]="['/categories', category()!.id, 'edit']">
            <ui-button variant="ghost">Modifier</ui-button>
          </a>
          <ui-button variant="danger" (click)="onDelete()">Supprimer</ui-button>
        </div>
      }
    </div>

    <ui-card>
      <p class="detail-info">Catégorie « {{ category()!.libelle }} »</p>
    </ui-card>
  </div>
}
