@if (loading()) {
  <p>Chargement...</p>
} @else if (errorMessage()) {
  <p>{{ errorMessage() }}</p>
} @else if (category()) {
  <h2>{{ category()!.libelle }}</h2>

  @if (authService.isAdmin()) {
    <a [routerLink]="['/categories', category()!.id, 'edit']">Modifier</a>
    <button (click)="onDelete()">Supprimer</button>
  }
}
