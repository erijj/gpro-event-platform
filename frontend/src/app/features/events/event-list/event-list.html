<div class="page-particles" appPageParticles></div>

<div class="hero-band">
  <div class="hero-content">
    <h1 class="hero-title">Événements</h1>
    @if (authService.isAdmin()) {
      <a routerLink="/events/create">
        <ui-button variant="primary">+ Nouvel événement</ui-button>
      </a>
    }
  </div>
</div>

@if (loading()) {
  <p class="state-loading">Chargement...</p>
}

@if (errorMessage()) {
  <p class="state-error">{{ errorMessage() }}</p>
}

@if (!loading() && !errorMessage()) {
  <div class="card-grid">
    @for (event of events(); track event.id) {
      <app-event-card [event]="event" />
    }
  </div>
}
