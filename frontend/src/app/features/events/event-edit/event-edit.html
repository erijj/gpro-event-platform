@if (loading()) {
  <p class="state-loading">Chargement...</p>
} @else {
  <div class="page">
    <h2 class="page-title">Modifier l'événement</h2>

    <ui-card>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
        <div class="form-group">
          <label class="form-label">Titre</label>
          <input type="text" formControlName="titre" class="form-input">
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea formControlName="description" class="form-textarea" rows="4"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Image (URL)</label>
          <input type="text" formControlName="image" class="form-input" placeholder="https://exemple.com/image.jpg">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Date et heure</label>
            <input type="datetime-local" formControlName="dateHeure" class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label">Lieu</label>
            <input type="text" formControlName="lieu" class="form-input">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Capacité max</label>
            <input type="number" formControlName="capaciteMax" class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label">Catégorie</label>
          <select formControlName="categoryId" class="form-select">
            <option [ngValue]="null" disabled>-- Choisir --</option>
            @for (cat of categories(); track cat.id) {
              <option [ngValue]="cat.id">{{ cat.libelle }}</option>
            }
          </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Statut</label>
            <select formControlName="statut" class="form-select">
              <option value="PLANIFIE">Planifié</option>
              <option value="EN_COURS">En cours</option>
              <option value="TERMINE">Terminé</option>
              <option value="ANNULE">Annulé</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <ui-button type="submit" [disabled]="form.invalid">Enregistrer</ui-button>
        </div>
      </form>
    </ui-card>
  </div>
}

@if (errorMessage()) {
  <p class="state-error">{{ errorMessage() }}</p>
}
