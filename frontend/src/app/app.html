<header>
  @if (authService.isLoggedIn()) {
    <span>Connecté : {{ authService.currentUser()?.prenom }} {{ authService.currentUser()?.nom }} ({{ authService.currentUserRole() }})</span>
    <button (click)="onLogout()">Déconnexion</button>
  } @else {
    <a routerLink="/login">Se connecter</a>
  }
</header>

@if (authService.isLoggedIn()) {
  <a routerLink="/mes-inscriptions">Mes inscriptions</a>
}

<router-outlet />
