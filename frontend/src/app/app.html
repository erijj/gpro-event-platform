<header>
  <div class="header-brand">
    <a routerLink="/events" class="header-logo">GPRO</a>
  </div>

  <nav class="header-nav">
    @if (authService.isLoggedIn()) {
      <a routerLink="/mes-inscriptions" routerLinkActive="nav-link-active" class="nav-link">Mes inscriptions</a>
    }
    @if (authService.isAdmin()) {
      <a routerLink="/categories" routerLinkActive="nav-link-active" class="nav-link">Catégories</a>
      <a routerLink="/users" routerLinkActive="nav-link-active" class="nav-link">Utilisateurs</a>
      <a routerLink="/registrations" routerLinkActive="nav-link-active" class="nav-link">Inscriptions</a>
    }
  </nav>

  <div class="header-actions">
    @if (authService.isLoggedIn()) {
      <span class="header-user">{{ authService.currentUser()?.prenom }} {{ authService.currentUser()?.nom }}</span>
      <span class="header-role">{{ authService.currentUserRole() }}</span>
      <button (click)="onLogout()" aria-label="Se déconnecter">Déconnexion</button>
    } @else {
      <a routerLink="/login" class="nav-link">Se connecter</a>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>
