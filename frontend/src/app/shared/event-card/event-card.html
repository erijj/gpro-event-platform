<a [routerLink]="['/events', event().id]" class="event-card">
  <div class="event-card-photo">
    @if (event().image) {
      <img [src]="event().image" [alt]="event().titre" />
    } @else {
      <div class="event-card-placeholder"></div>
    }
  </div>

  <div class="event-card-body">
    <h3 class="event-card-title">{{ event().titre }}</h3>

    <div class="event-card-meta">
      <span class="event-card-date">{{ event().dateHeure | date:'dd/MM/yyyy HH:mm' }}</span>
      <span class="event-card-lieu">{{ event().lieu }}</span>
    </div>

    <div class="event-card-footer">
      <ui-badge [variant]="event().statut === 'PLANIFIE' ? 'info' : event().statut === 'EN_COURS' ? 'warning' : event().statut === 'TERMINE' ? 'success' : 'danger'">
        {{ event().statut }}
      </ui-badge>
      <span class="event-card-capacity">{{ event().placesRestantes }} / {{ event().capaciteMax }} places</span>
    </div>
  </div>
</a>
